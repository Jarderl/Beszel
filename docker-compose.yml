# =====================================================================
#  Beszel — hub (painel web) + agente local
#
#  O hub guarda o histórico e mostra os gráficos. O agente coleta CPU,
#  memória, disco, rede e containers do servidor. Aqui os dois rodam na
#  mesma máquina e conversam por um socket Unix compartilhado.
#  Para monitorar outros servidores, use agente/docker-compose.yml.
# =====================================================================

name: beszel

services:
  beszel:
    image: henrygd/beszel:${BESZEL_TAG:-latest}
    container_name: beszel
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      # Endereço pelo qual o hub é acessado (domínio do NPM ou IP:porta)
      APP_URL: ${APP_URL:-http://localhost:8090}
    ports:
      - "${HUB_PORT:-8090}:8090"
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket

  beszel-agent:
    image: henrygd/beszel-agent:${BESZEL_TAG:-latest}
    container_name: beszel-agent
    restart: unless-stopped
    # Obrigatório: só em modo host o agente enxerga as interfaces de rede reais
    network_mode: host
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:${HUB_PORT:-8090}
      TOKEN: ${AGENT_TOKEN:-}
      KEY: ${AGENT_KEY:-}
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      # Estatísticas dos containers (somente leitura)
      - /var/run/docker.sock:/var/run/docker.sock:ro
